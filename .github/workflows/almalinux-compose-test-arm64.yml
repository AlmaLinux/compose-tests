name: almalinux-compose-test-arm64

run-name: AlmaLinux ${{ inputs.version_major }} compose test (aarch64)${{ inputs.pungi_repository && ' +pungi' || '' }}${{ inputs.pulp_repository && ' +pulp' || '' }}

on:
  workflow_dispatch:
      inputs:

        version_major:
          description: 'AlmaLinux major version'
          required: true
          default: '10'
          type: choice
          options:
            - 10-kitten
            - 10
            - 9
            - 8

        pungi_repository:
          description: 'Add pungi repositories'
          type: boolean

        pulp_repository:
          description: 'Add pulp repositories'
          type: boolean
          default: true

        testing_repository:
          description: 'Add testing repository'
          type: boolean
          default: false

        disable_default_repos:
          description: 'Disable system default repositories'
          type: boolean
          default: false

        rerun_failed:
          description: 'Re-run failed tests'
          type: boolean
          default: true

        notify_mattermost:
          description: 'Send results notification to Mattermost'
          type: boolean
          default: true

  # Allow this workflow to be called from the 'almalinux-compose-test' orchestrator.
  # 'workflow_call' has no 'choice' input type, so 'version_major' is a string here.
  workflow_call:
    inputs:
      version_major:
        description: 'AlmaLinux major version'
        required: true
        type: string
      pungi_repository:
        description: 'Add pungi repositories'
        type: boolean
        default: false
      pulp_repository:
        description: 'Add pulp repositories'
        type: boolean
        default: true
      testing_repository:
        description: 'Add testing repository'
        type: boolean
        default: false
      disable_default_repos:
        description: 'Disable system default repositories'
        type: boolean
        default: false
      rerun_failed:
        description: 'Re-run failed tests'
        type: boolean
        default: true
      notify_mattermost:
        description: 'Send results notification to Mattermost'
        type: boolean
        default: true

jobs:

  compose-test:
    name: AlmaLinux ${{ inputs.version_major }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      # Default SSH user of the official AlmaLinux AMIs
      ssh_user: ec2-user
      # SSH alias configured in ~/.ssh/config (see 'Wait for SSH' step)
      ssh_host: almalinux

    steps:
    - uses: actions/checkout@v5

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Prepare stuff
      run: |
        # Environment variables
        pungi_latest_result=latest_result_almalinux
        pulp_root=${{ inputs.version_major }}
        tmt_options=
        rpm_gpg_key=/etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux
        release_version=${{ inputs.version_major }}
        dnf_crb_repo='CRB'
        dnf_extras_repo='extras'

        case ${{ inputs.version_major }} in
          8)
            dnf_crb_repo='PowerTools'
            ;;
          9)
            tmt_options='--feeling-safe'
            rpm_gpg_key="${rpm_gpg_key}-9"
            ;;
          10)
            tmt_options='--feeling-safe'
            rpm_gpg_key="${rpm_gpg_key}-10"
            ;;
          10-kitten)
            release_version=10
            pulp_root=kitten-10
            pungi_latest_result="${pungi_latest_result}-kitten"
            tmt_options='--feeling-safe'
            rpm_gpg_key="${rpm_gpg_key}-10"
            dnf_extras_repo='extras-common'
            ;;
        esac
        # Release major version
        echo "release_version=${release_version}" >> $GITHUB_ENV

        # Pulp repository root of the release
        echo "pulp_root=${pulp_root}" >> $GITHUB_ENV

        # Pungi repository latest results directory
        echo "pungi_latest_result=${pungi_latest_result}" >> $GITHUB_ENV

        # Name of repository to enable (PowerTools/CRB)
        if [ "x${{ inputs.pulp_repository }}" = "xtrue" ]; then
          # Lowercase the name for path in pulp's URL
          pulp_crb_repo="${dnf_crb_repo,,}"
        fi
        echo "dnf_crb_repo=${dnf_crb_repo}" >> $GITHUB_ENV
        echo "pulp_crb_repo=${pulp_crb_repo}" >> $GITHUB_ENV
        echo "dnf_extras_repo=${dnf_extras_repo}" >> $GITHUB_ENV

        # TMT extra options
        echo "tmt_options=${tmt_options}" >> $GITHUB_ENV

        # RPM_GPG_KEY file
        echo "rpm_gpg_key=${rpm_gpg_key}" >> $GITHUB_ENV

        # TMT tests run directory (on the instance)
        echo "tmt_run_dir=/var/tmp/tmt/run-001" >> $GITHUB_ENV

        # Local directory on the runner to gather artifacts pulled from the instance
        artifacts_dir="${{ github.workspace }}/artifacts"
        mkdir -p "${artifacts_dir}"
        echo "artifacts_dir=${artifacts_dir}" >> $GITHUB_ENV

        # For nvidia drivers tests
        case ${{ inputs.version_major }} in
          8)
            nvidia=false
            ;;
          *)
            nvidia=true
            ;;
        esac
        echo "nvidia=${nvidia}" >> $GITHUB_ENV

    - name: Get AlmaLinux ${{ inputs.version_major }} aarch64 AMI most recent ID
      run: |
        os_version="${{ inputs.version_major }}"
        if [[ "${os_version}" == "10-kitten" ]]; then
          os_version="Kitten 10"
        fi
        AMI_ID=$(aws ec2 describe-images --owners 764336703387 --query "Images | max_by(@, &CreationDate) | ImageId" --filters "Name=name,Values=AlmaLinux OS ${os_version}*aarch64" --region ${{ secrets.AWS_REGION }} --output text)
        if [[ "${AMI_ID}" == "" || "${AMI_ID}" == "None" ]]; then
          echo "[Error] Failed to get AMI ID for AlmaLinux ${os_version} aarch64."
          exit 1
        else
          echo "[Debug] AMI ID: '${AMI_ID}'"
        fi
        echo "AMI_ID=${AMI_ID}" >> $GITHUB_ENV

    - name: Generate SSH key pair
      run: |
        # The IAM role may not import/create EC2 key pairs, so we don't register
        # one with AWS. The public key is injected into the instance via user-data
        # (see 'Launch EC2 instance'); only the private key stays on the runner.
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        ssh-keygen -t ed25519 -f ~/.ssh/id_ec2 -N '' -q

    - name: Launch EC2 instance
      run: |
        # Match the instance's root device name so the size override is applied to it
        root_dev=$(aws ec2 describe-images --image-ids ${{ env.AMI_ID }} \
          --query 'Images[0].RootDeviceName' --output text)

        # User-data does two things on first boot:
        #  1. Installs our SSH public key for ${{ env.ssh_user }} (the IAM role
        #     can't register an EC2 key pair, so we can't use --key-name).
        #  2. Self-destruct failsafe: if the workflow (or GitHub) dies before the
        #     'Cleanup AWS resources' step runs, the instance still terminates
        #     itself ~2 hours after launch. A systemd timer anchored to an
        #     absolute time (not OnBootSec, which would reset on our mid-run
        #     reboot) powers the box off; combined with
        #     --instance-initiated-shutdown-behavior=terminate that terminates the
        #     instance. A 'reboot' is not a power-off, so it is safe.
        pubkey=$(cat ~/.ssh/id_ec2.pub)
        cat > /tmp/userdata.sh <<USERDATA
        #!/bin/bash
        install -d -m 700 -o ${{ env.ssh_user }} -g ${{ env.ssh_user }} /home/${{ env.ssh_user }}/.ssh
        echo "${pubkey}" >> /home/${{ env.ssh_user }}/.ssh/authorized_keys
        chown ${{ env.ssh_user }}:${{ env.ssh_user }} /home/${{ env.ssh_user }}/.ssh/authorized_keys
        chmod 600 /home/${{ env.ssh_user }}/.ssh/authorized_keys
        USERDATA

        cat >> /tmp/userdata.sh <<'USERDATA'
        shutdown_at=$(date -u -d '+2 hours' '+%Y-%m-%d %H:%M:%S')
        cat >/etc/systemd/system/selfdestruct.service <<'UNIT'
        [Unit]
        Description=Self-destruct: power off so EC2 terminates the instance
        [Service]
        Type=oneshot
        ExecStart=/usr/sbin/poweroff
        UNIT
        cat >/etc/systemd/system/selfdestruct.timer <<UNIT
        [Unit]
        Description=Self-destruct timer (~2h after launch)
        [Timer]
        OnCalendar=${shutdown_at}
        Persistent=true
        AccuracySec=1min
        [Install]
        WantedBy=timers.target
        UNIT
        systemctl daemon-reload
        systemctl enable --now selfdestruct.timer
        USERDATA

        # The subnet pins us to a single AZ, whose capacity for a given type can
        # run out (InsufficientInstanceCapacity). Try a few equivalent Graviton
        # types in order, falling through only on a capacity error; any other
        # error fails immediately. All are 4 vCPU (c7g/m7g/c6g = 8GB, t4g = 16GB).
        instance_id=
        for itype in c7g.xlarge m7g.xlarge c6g.xlarge t4g.xlarge; do
          echo "[Debug] Trying instance type ${itype}"
          instance_id=$(aws ec2 run-instances \
            --image-id ${{ env.AMI_ID }} \
            --instance-type "${itype}" \
            --subnet-id ${{ secrets.EC2_SUBNET_ID }} \
            --security-group-ids ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --associate-public-ip-address \
            --instance-initiated-shutdown-behavior terminate \
            --user-data file:///tmp/userdata.sh \
            --block-device-mappings "[{\"DeviceName\":\"${root_dev}\",\"Ebs\":{\"VolumeSize\":30,\"VolumeType\":\"gp3\",\"DeleteOnTermination\":true}}]" \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Project,Value=GitHub Actions Self-hosted Runners},{Key=Name,Value=compose-test-arm64-${{ github.run_id }}}]' \
            --query 'Instances[0].InstanceId' --output text 2>/tmp/run-instances.err) && break
          instance_id=
          if grep -q 'InsufficientInstanceCapacity' /tmp/run-instances.err; then
            echo "[Debug] No ${itype} capacity in this AZ, trying the next type..."
            continue
          fi
          # Any other error is fatal
          cat /tmp/run-instances.err >&2
          exit 1
        done

        if [ -z "${instance_id}" ]; then
          echo "[Error] Could not launch any instance type (no capacity in this AZ)." >&2
          exit 1
        fi

        echo "[Debug] Launched instance: ${instance_id}"
        echo "instance_id=${instance_id}" >> $GITHUB_ENV

    - name: Wait for SSH and configure access
      run: |
        aws ec2 wait instance-running --instance-ids ${{ env.instance_id }}
        instance_ip=$(aws ec2 describe-instances --instance-ids ${{ env.instance_id }} \
          --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
        echo "[Debug] Instance public IP: ${instance_ip}"

        # SSH alias used by all the steps below ('ssh almalinux ...', 'scp ... almalinux:...')
        cat > ~/.ssh/config <<EOF
        Host ${{ env.ssh_host }}
          HostName ${instance_ip}
          User ${{ env.ssh_user }}
          IdentityFile ~/.ssh/id_ec2
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          ConnectTimeout 10
          # Ride out transient unresponsiveness under heavy load (e.g. the osbuild
          # image build) instead of dropping the session: ~150s before giving up.
          ServerAliveInterval 15
          ServerAliveCountMax 10
          TCPKeepAlive yes
        EOF

        # Wait for sshd to accept connections
        for i in $(seq 1 60); do
          ssh ${{ env.ssh_host }} true 2>/dev/null && break
          echo "[Debug] Waiting for SSH (${i})"
          sleep 10
        done
        ssh ${{ env.ssh_host }} 'echo "[Debug] Connected as $(whoami) on $(hostname)"'

    - name: Create AlmaLinux pungi repository
      if: inputs.pungi_repository
      run: |
        cat <<'EOF'>"${{ env.artifacts_dir }}/almalinux-pungi.repo"
        [almalinux-${{ env.release_version }}-appstream-pungi]
        baseurl = http://aarch64-pungi-${{ env.release_version }}.almalinux.dev/almalinux/${{ env.release_version }}/$arch/${{ env.pungi_latest_result }}/compose/AppStream/$arch/os/
        enabled = 1
        name = almalinux-${{ env.release_version }}-appstream-pungi
        gpgkey=file://${{ env.rpm_gpg_key }}

        [almalinux-${{ env.release_version }}-baseos-pungi]
        baseurl = http://aarch64-pungi-${{ env.release_version }}.almalinux.dev/almalinux/${{ env.release_version }}/$arch/${{ env.pungi_latest_result }}/compose/BaseOS/$arch/os/
        enabled = 1
        name = almalinux-${{ env.release_version }}-baseos-pungi
        gpgkey=file://${{ env.rpm_gpg_key }}

        [almalinux-${{ env.release_version }}-${{ env.dnf_crb_repo }}-pungi]
        baseurl = http://aarch64-pungi-${{ env.release_version }}.almalinux.dev/almalinux/${{ env.release_version }}/$arch/${{ env.pungi_latest_result }}/compose/${{ env.dnf_crb_repo }}/$arch/os/
        enabled = 1
        name = almalinux-${{ env.release_version }}-${{ env.dnf_crb_repo }}-pungi
        gpgkey=file://${{ env.rpm_gpg_key }}

        [almalinux-${{ env.release_version }}-${{ env.dnf_extras_repo }}-pungi]
        baseurl = http://aarch64-pungi-${{ env.release_version }}.almalinux.dev/almalinux/${{ env.release_version }}/$arch/${{ env.pungi_latest_result }}/compose/${{ env.dnf_extras_repo }}/$arch/os/
        enabled = 1
        name = almalinux-${{ env.release_version }}-${{ env.dnf_extras_repo }}-pungi
        gpgkey=file://${{ env.rpm_gpg_key }}
        EOF

    - name: Create AlmaLinux pulp repository
      if: inputs.pulp_repository
      run: |
        cat <<'EOF'>"${{ env.artifacts_dir }}/almalinux-pulp.repo"
        [almalinux-${{ env.pulp_root }}-appstream-pulp]
        baseurl = https://build.almalinux.org/pulp/content/prod/almalinux-${{ env.pulp_root }}-appstream-$arch/
        enabled = 1
        name = almalinux-${{ env.pulp_root }}-appstream-pulp
        gpgkey=file://${{ env.rpm_gpg_key }}

        [almalinux-${{ env.pulp_root }}-baseos-pulp]
        baseurl = https://build.almalinux.org/pulp/content/prod/almalinux-${{ env.pulp_root }}-baseos-$arch/
        enabled = 1
        name = almalinux-${{ env.pulp_root }}-baseos-pulp
        gpgkey=file://${{ env.rpm_gpg_key }}

        [almalinux-${{ env.pulp_root }}-${{ env.pulp_crb_repo }}-pulp]
        baseurl = https://build.almalinux.org/pulp/content/prod/almalinux-${{ env.pulp_root }}-${{ env.pulp_crb_repo }}-$arch/
        enabled = 1
        name = almalinux-${{ env.pulp_root }}-${{ env.pulp_crb_repo }}-pulp
        gpgkey=file://${{ env.rpm_gpg_key }}

        [almalinux-${{ env.pulp_root }}-${{ env.dnf_extras_repo }}-pulp]
        baseurl = https://build.almalinux.org/pulp/content/prod/almalinux-${{ env.pulp_root }}-${{ env.dnf_extras_repo }}-$arch/
        enabled = 1
        name = almalinux-${{ env.pulp_root }}-${{ env.dnf_extras_repo }}-pulp
        gpgkey=file://${{ env.rpm_gpg_key }}
        EOF

    - name: Create AlmaLinux testing pulp repository
      # Kitten has no testing repository, so skip it there
      if: inputs.pulp_repository && inputs.testing_repository && inputs.version_major != '10-kitten'
      run: |
        cat <<'EOF'>"${{ env.artifacts_dir }}/almalinux-testing-pulp.repo"
        [almalinux-${{ env.pulp_root }}-testing-pulp]
        baseurl = https://build.almalinux.org/pulp/content/prod/almalinux-${{ env.pulp_root }}-testing-$arch/
        enabled = 1
        name = almalinux-${{ env.pulp_root }}-testing-pulp
        gpgkey=file://${{ env.rpm_gpg_key }}
        EOF

    - name: Create AlmaLinux nvidia pulp repository
      if: env.nvidia == 'true' && inputs.pulp_repository
      run: |
        # Repositories of the 'almalinux-nvidia' product
        # https://build.almalinux.org/product/777
        cat <<'EOF'>"${{ env.artifacts_dir }}/almalinux-nvidia-pulp.repo"
        [almalinux-${{ env.pulp_root }}-nvidia-pulp]
        baseurl = https://build.almalinux.org/pulp/content/copr/anfimovdm-almalinux-nvidia-almalinux-${{ env.pulp_root }}-$arch-dr/
        enabled = 1
        name = almalinux-${{ env.pulp_root }}-nvidia-pulp
        gpgkey=file://${{ env.rpm_gpg_key }},file:///etc/pki/rpm-gpg/RPM-GPG-KEY-NVIDIA-CUDA-${{ env.release_version }}
        EOF

    - name: Push repositories to the instance
      run: |
        for repo in almalinux-pungi almalinux-pulp almalinux-testing-pulp almalinux-nvidia-pulp; do
          f="${{ env.artifacts_dir }}/${repo}.repo"
          if [ -e "$f" ]; then
            echo "[Debug] Installing ${repo}.repo"
            scp "$f" ${{ env.ssh_host }}:/tmp/${repo}.repo
            ssh ${{ env.ssh_host }} "sudo cp -av /tmp/${repo}.repo /etc/yum.repos.d/${repo}.repo"
          fi
        done

    - name: Update the system and reboot
      run: |
        ssh ${{ env.ssh_host }} "sudo dnf -y clean all"
        ssh ${{ env.ssh_host }} "sudo dnf -y upgrade"

        # Reboot to boot the newly installed kernel, then wait for SSH to come back
        echo "[Debug] Rebooting to run the newly installed kernel"
        ssh ${{ env.ssh_host }} "sudo reboot" || true
        sleep 30
        for i in $(seq 1 60); do
          ssh ${{ env.ssh_host }} true 2>/dev/null && break
          echo "[Debug] Waiting for SSH after reboot (${i})"
          sleep 10
        done
        echo "[Debug] Running kernel:"
        ssh ${{ env.ssh_host }} "uname -r"

    - name: Get compose-tests onto the instance
      run: |
        tar --exclude=./artifacts -C "${{ github.workspace }}" -czf /tmp/compose-tests.tgz .
        scp /tmp/compose-tests.tgz ${{ env.ssh_host }}:/tmp/compose-tests.tgz
        ssh ${{ env.ssh_host }} "sudo rm -rf /compose-tests && sudo mkdir -p /compose-tests && sudo tar -C /compose-tests -xzf /tmp/compose-tests.tgz"

    - name: Get system release
      run: |
        echo "system_release=$(ssh ${{ env.ssh_host }} 'cat /etc/almalinux-release')" >> $GITHUB_ENV

    - name: Add testing repository
      # With pulp the testing repo comes from pulp (see the pulp step above).
      # Kitten has no testing repository, so skip it there.
      if: inputs.testing_repository && !inputs.pulp_repository && inputs.version_major != '10-kitten'
      run: |
        ssh ${{ env.ssh_host }} "sudo dnf install -y almalinux-release-testing"

    - name: Prepare test infrastructure
      run: |
        ssh ${{ env.ssh_host }} 'sudo bash -s' <<'REMOTE'
        enable_repo=${{ env.dnf_crb_repo }}
        dnf_opts="--enablerepo=${enable_repo,,}"
        if [ "${{ inputs.disable_default_repos }}" = "true" ]; then
          # Disable all enabled system repositories
          for enabled_repo in $(dnf repolist --enabled | awk '/repo id/ {A=1; next} A {print $1}' | grep -v -E 'pungi|pulp'); do
            echo "[Debug] Disable '${enabled_repo}' repository"
            dnf config-manager --set-disabled ${enabled_repo}
          done
          dnf_opts=
        fi
        case ${{ inputs.version_major }} in
          10-kitten)
            dnf install -y ${dnf_opts} epel-release almalinux-kitten-release-devel
            [ "${{ inputs.disable_default_repos }}" = "false" ] && \
              dnf_opts="${dnf_opts} --enablerepo=devel"
            dnf install -y ${dnf_opts} python3-pip beakerlib initscripts-service
            export PATH=$PATH:/usr/local/bin; pip install flexparser==0.3.1 tmt
            ;;
          10)
            dnf install -y ${dnf_opts} epel-release
            dnf install -y ${dnf_opts} python3-pip beakerlib initscripts-service
            export PATH=$PATH:/usr/local/bin; pip install flexparser==0.3.1 tmt
            ;;
          9)
            dnf install -y ${dnf_opts} epel-release
            dnf install -y ${dnf_opts} tmt initscripts-service
            ;;
          *)
            dnf install -y ${dnf_opts} epel-release
            dnf install -y ${dnf_opts} tmt tmt-report-html
            ;;
        esac
        export PATH=$PATH:/usr/local/bin
        echo "[Debug] tmt version: $(tmt --version)"
        REMOTE

    - name: Run tests
      id: run-tests
      continue-on-error: true
      run: |
        # continue-on-error lets us always collect logs and notify; capture the
        # real exit code so a later step can tell a clean run (tmt 0=all pass,
        # 1=some failed) from an aborted one (e.g. 255 = the SSH session/instance
        # died mid-run, 2 = tmt error).
        set +e
        ssh ${{ env.ssh_host }} 'sudo bash -s' <<'REMOTE'
        export pungi_repository=${{ inputs.pungi_repository }}
        export pulp_repository=${{ inputs.pulp_repository }}
        export PATH=$PATH:/usr/local/bin
        cd /compose-tests
        tmt -vvv -c distro=centos-stream-${{ env.release_version }} run --all provision --how=local ${{ env.tmt_options }}
        REMOTE
        rc=$?
        echo "[Debug] tmt/ssh exit code: ${rc}"
        echo "tmt_rc=${rc}" >> "$GITHUB_OUTPUT"
        exit ${rc}

    - name: ${{ inputs.version_major }} tests results
      run: |
        ssh ${{ env.ssh_host }} 'sudo bash -s' <<'REMOTE'
        #[Debug]
        find ${{ env.tmt_run_dir }}/plans/*/execute -name "results.yaml" -exec cat {} \;

        out=/tmp/ct-collect
        rm -rf "$out"; mkdir -p "$out"
        for f in $(find ${{ env.tmt_run_dir }}/plans/*/execute -name "results.yaml"); do
          cp -av "$f" "$out/$(basename "$(dirname "$(dirname "$f")")").results.yaml"
        done
        chmod -R a+r "$out"
        REMOTE
        scp ${{ env.ssh_host }}:'/tmp/ct-collect/*.results.yaml' "${{ env.artifacts_dir }}/" 2>/dev/null || true

    - name: ${{ inputs.version_major }} tests log
      run: |
        #[Debug]
        ssh ${{ env.ssh_host }} "sudo cat ${{ env.tmt_run_dir }}/log.txt"

        ssh ${{ env.ssh_host }} "sudo cp -av ${{ env.tmt_run_dir }}/log.txt /tmp/log.txt && sudo chmod a+r /tmp/log.txt"
        scp ${{ env.ssh_host }}:/tmp/log.txt "${{ env.artifacts_dir }}/log.txt"

    - name: ${{ inputs.version_major }} tests output
      run: |
        ssh ${{ env.ssh_host }} 'sudo bash -s' <<'REMOTE'
        cd ${{ env.tmt_run_dir }}/
        tar cf /tmp/output.tar $( find . -name output.txt ) || true
        chmod a+r /tmp/output.tar
        REMOTE
        scp ${{ env.ssh_host }}:/tmp/output.tar "${{ env.artifacts_dir }}/output.tar" || true

    - uses: actions/upload-artifact@v6
      with:
        name: Tests log
        path: ${{ env.artifacts_dir }}/log.txt

    - uses: actions/upload-artifact@v6
      with:
        name: Tests results
        path: ${{ env.artifacts_dir }}/*.results.yaml

    - uses: actions/upload-artifact@v6
      with:
        name: Tests output
        path: ${{ env.artifacts_dir }}/output.tar

    - name: Evaluate test results
      id: eval
      if: always()
      run: |
        # Tally the collected results.yaml, build the failed-tests list, and
        # decide whether the run actually completed.
        if ! command -v yq >/dev/null 2>&1; then
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
        fi

        shopt -s nullglob
        total=0; passed=0; failed=0; errored=0
        : > "${artifacts_dir}/tests_failed.txt"
        for f in "${artifacts_dir}"/*.results.yaml; do
          total=$((  total   + $(yq '. | length'                                  "$f" 2>/dev/null || echo 0) ))
          passed=$(( passed  + $(yq '[.[] | select(.result == "pass")]  | length' "$f" 2>/dev/null || echo 0) ))
          failed=$(( failed  + $(yq '[.[] | select(.result == "fail")]  | length' "$f" 2>/dev/null || echo 0) ))
          errored=$((errored + $(yq '[.[] | select(.result == "error")] | length' "$f" 2>/dev/null || echo 0) ))
          yq '.[] | select(.result == "fail" or .result == "error") | .name' "$f" 2>/dev/null \
            >> "${artifacts_dir}/tests_failed.txt"
        done
        failed_total=$(( failed + errored ))

        echo "total=${total}"         >> "$GITHUB_OUTPUT"
        echo "passed=${passed}"       >> "$GITHUB_OUTPUT"
        echo "failed=${failed_total}" >> "$GITHUB_OUTPUT"

        # Completeness: a clean tmt run exits 0 (all pass) or 1 (some failed).
        # Anything else (255 = SSH/instance died mid-run, 2 = tmt error, ...) or
        # zero recorded results means the run was aborted before finishing.
        rc='${{ steps.run-tests.outputs.tmt_rc }}'
        incomplete=false
        case "${rc}" in 0|1) ;; *) incomplete=true ;; esac
        [ "${total}" -eq 0 ] && incomplete=true
        echo "incomplete=${incomplete}" >> "$GITHUB_OUTPUT"

        echo "[Debug] total=${total} passed=${passed} failed=${failed_total} tmt_rc=${rc} incomplete=${incomplete}"

    - name: Re-run failed tests, prepare tests summary
      # Only when the run completed and recorded failures; an aborted run is
      # handled by the completeness gate at the end of the job.
      if: ${{ always() && steps.eval.outputs.incomplete == 'false' && steps.eval.outputs.failed != '0' }}
      run: |
        # Tests results and the step exit code
        rerun_results=
        exit_code=0

        # Read failed tests list
        for test_failed in $(cat "${{ env.artifacts_dir }}/tests_failed.txt" | xargs); do
          echo "[Debug] Re-run '${test_failed}'"

          # Include failed test name into results summary
          test_result="${test_failed}"

          # Re-run specific failed test
          if [ "${{ inputs.rerun_failed }}" = "true" ]; then
            if ssh ${{ env.ssh_host }} "sudo sh -c 'export pungi_repository=${{ inputs.pungi_repository }}; export pulp_repository=${{ inputs.pulp_repository }}; export PATH=\$PATH:/usr/local/bin; cd /compose-tests; tmt -vvv -c distro=centos-stream-${{ env.release_version }} run --all provision --how=local ${{ env.tmt_options }} test --name ${test_failed}'"; then
              test_result="${test_failed} [re-run ✅]"
            else
              test_result="${test_failed} [re-run ❌]"
              exit_code=1
            fi
          else
            echo "[Debug]"
            echo "If without re-run, fail this step as the '${test_failed}' test previously failed."
            exit_code=1
          fi

          # Format test results in list format: 'item1', 'item2', ...
          [ "x${rerun_results}" = "x" ] && rerun_results="'${test_result}'" || rerun_results="${rerun_results}, '${test_result}'"

        done

        # Export header and test results
        [ "x${rerun_results}" = "x" ] && summary_header="✅ All tests pass." || summary_header="❌ Failed tests:"
        echo "rerun_results=${rerun_results}" >> $GITHUB_ENV
        echo "summary_header=${summary_header}" >> $GITHUB_ENV

        exit $exit_code

    - name: Print tests summary
      id: summary
      # Always run so the run-page summary and the Mattermost text are produced
      # for both passing and failing runs.
      if: always()
      uses: actions/github-script@v8
      with:
        result-encoding: string
        script: |
          const repos = [
            'pulp - ${{ inputs.pulp_repository && '➕' || '➖' }}',
            'pungi - ${{ inputs.pungi_repository && '➕' || '➖' }}',
            'testing - ${{ inputs.testing_repository && '➕' || '➖' }}',
            'default repos - ${{ inputs.disable_default_repos && '➖' || '➕' }}',
          ];
          // Re-run annotated failures (set only when the re-run step ran).
          const rerun = [${{ env.rerun_results }}];

          const passed     = parseInt('${{ steps.eval.outputs.passed }}' || '0', 10);
          const failed     = parseInt('${{ steps.eval.outputs.failed }}' || '0', 10);
          const total      = parseInt('${{ steps.eval.outputs.total  }}' || '0', 10);
          const incomplete = '${{ steps.eval.outputs.incomplete }}' === 'true';
          const rc         = '${{ steps.run-tests.outputs.tmt_rc }}';

          // The counts above are the FIRST run. Reconcile them with the re-run
          // outcomes: entries are annotated '… [re-run ✅]' (recovered) /
          // '… [re-run ❌]' (still failing); unmarked means re-run was disabled.
          const reran        = rerun.some(r => r.includes('[re-run'));
          const recovered    = rerun.filter(r => r.includes('✅')).length;
          const stillFailing = rerun.length - recovered;

          let header;
          if (incomplete) header = `⚠️ Test run did NOT complete — only ${total} results recorded (tmt/ssh exit ${rc}).`;
          else if (stillFailing > 0) header = `❌ ${stillFailing} of ${total} tests failed.`;
          else if (recovered > 0) header = `✅ All ${total} tests passed (${recovered} recovered on re-run).`;
          else header = `✅ All ${total} tests passed.`;

          const counts = `Passed: ${passed} · Failed: ${failed} · Total: ${total}`;
          const rerunLine = reran ? `Re-run — recovered: ${recovered} · still failing: ${stillFailing}` : '';

          // Run-page summary
          let summary = core.summary
              .addHeading('${{ env.system_release }}', '4')
              .addHeading('Used repositories:', '4')
              .addList(repos, true)
              .addHeading(header, '4')
              .addRaw(counts).addBreak();
          if (rerunLine) summary = summary.addRaw(rerunLine).addBreak();
          summary.addList(rerun, true).write();

          // Markdown text for the Mattermost notification
          const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
          const text = [
            '#### AlmaLinux ${{ inputs.version_major }} aarch64 — compose tests',
            '**${{ env.system_release }}**',
            '',
            header,
            counts,
            ...(rerunLine ? [rerunLine] : []),
            '',
            '**Used repositories:**',
            ...repos.map(r => '- ' + r),
            ...(rerun.length ? ['', '**Re-run failed tests:**', ...rerun.map(r => '- ' + r)] : []),
            '',
            '[Workflow run](' + runUrl + ')',
          ].join('\n');
          core.setOutput('text', text);

    - name: Send notification to Mattermost
      uses: mattermost/action-mattermost-notify@master
      # Notify on both pass and fail; never fail the job on a notification error
      if: ${{ always() && inputs.notify_mattermost }}
      continue-on-error: true
      with:
        MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        MATTERMOST_CHANNEL: ${{ vars.MATTERMOST_CHANNEL }}
        MATTERMOST_USERNAME: ${{ github.triggering_actor }}
        TEXT: |
          ${{ steps.summary.outputs.text }}

    - name: Cleanup AWS resources
      if: always()
      run: |
        # Terminate the instance
        if [ -n "${{ env.instance_id }}" ]; then
          echo "[Debug] Terminating ${{ env.instance_id }}"
          aws ec2 terminate-instances --instance-ids ${{ env.instance_id }} || true
          aws ec2 wait instance-terminated --instance-ids ${{ env.instance_id }} || true
        fi

    - name: Fail if the test run did not complete
      # Runs last (after notification and cleanup) so an aborted/incomplete run —
      # e.g. a test that kills the SSH session, leaving an empty results.yaml —
      # is reported as a failure instead of a false green.
      if: ${{ always() && steps.eval.outputs.incomplete == 'true' }}
      run: |
        echo "::error::Test run did not complete: tmt/ssh exit '${{ steps.run-tests.outputs.tmt_rc }}', ${{ steps.eval.outputs.total }} results recorded."
        exit 1
